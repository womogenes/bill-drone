[project]
name = "src"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "mujoco>=3.16.0",
    "opencv-python>=5.0.0.93",
    "pandas>=3.0.6",
    "pyserial>=3.5",
    "requests>=2.34.2",
    "websocket-client>=1.9.2",
]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["sw", "sw.sim", "fw"]
