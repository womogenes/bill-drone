[platformio]
default_envs = s3cam

[env:esp32cam]
platform = espressif32@6.12.0
board = esp32cam
framework = arduino
board_build.partitions = default.csv
extra_scripts = pre:build.py
monitor_speed = 115200
lib_deps = https://github.com/raspiduino/apriltag-esp32.git#5413a2926e26922f44ca12d49d58d84b22b9002d

# Console build for diagnosis: UART0 at 115200 with logs and a status line every 2 s, no drone link. Flash over USB, then `pio device monitor -d fw/esp32cam`.
[env:debug]
extends = env:esp32cam
build_flags = -DDEBUG_CONSOLE

[env:ota]
extends = env:esp32cam
upload_protocol = espota
upload_port = bill-esp32cam.local

# NULLLAB ESP32S3-CAM, the drone's camera from 2026-11-02 (ESP32-S3R8: 8 MB octal PSRAM, 8 MB flash). Its USB-C is the chip's own USB (Serial); the drone link is UART0 on GPIO43/44.
[env:s3cam]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
build_flags = -DBOARD_HAS_PSRAM -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1
extra_scripts = pre:build.py
monitor_speed = 115200
lib_deps = ${env:esp32cam.lib_deps}
